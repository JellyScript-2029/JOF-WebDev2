<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Detail</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
 
    <h1>Product Details</h1>
 
    <div>
        <p><strong>ID:</strong> <span th:text="${product.id}">1</span></p>
        <p><strong>Name:</strong> <span th:text="${product.name}">Sample Name</span></p>
        <p><strong>Price:</strong> PHP <span th:text="${product.price}">0.00</span></p>
 
        <p><strong>Category:</strong> <span th:text="${product.category?.name}">Category Name</span></p>
    </div>
 
    <br>
    <a th:href="@{/products}">Back to Catalog</a>
</body>
</html>
